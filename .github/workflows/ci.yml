name: SQL Mastery CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Automated Challenge Tests
        run: |
          python scripts/validate_challenges.py

      - name: Test CLI Tool
        run: |
          cd cli_tool
          python interactive_practice.py --test

      - name: Test Node.js App Integration Syntax
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd app_integration
          node -c index.js
